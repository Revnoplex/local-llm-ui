<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{title}</title>
        <script>window.sessionId = "{sessionId}";</script>
        <script type="module" src="/js/main.js" defer></script>
        <link rel="stylesheet" type="text/css" href="/css/main.css">
        <link rel="stylesheet" type="text/css" href="/css/katex/katex.css">
    </head>
    <body>
        <div class="status-bar">
            <div class="status-bar-element" style="display: flex; align-items: center;">
            <p id="modelStatus">Model Status Will Appear here</p>
            &emsp;
            <label for="keepAliveSelect">Keep Alive:&nbsp;</label>
            <select name="keepAliveOptions" id="keepAliveSelect">
                <option class='keepAliveOption' value="0"class="status-bar-element">Shutdown immediately</option>
                <option class='keepAliveOption' value="60"class="status-bar-element">1 minute</option>
                <option class='keepAliveOption' value="300" selected class="status-bar-element">5 minutes</option>
                <option class='keepAliveOption' value="600"class="status-bar-element">10 minutes</option>
                <option class='keepAliveOption' value="1800"class="status-bar-element">30 minutes</option>
                <option class='keepAliveOption' value="3600"class="status-bar-element">1 hour</option>
                <option class='keepAliveOption' value="-1"class="status-bar-element">Indefinately</option>
            </select>
            </div>
            <h1 style='text-align: center;'>{title}</h1>
            <p id="ollamaStatus" class="status-bar-element" style="text-align: right">Connecting to ollama server....</p>
            &emsp;
            <button id="clearContextBtn" class="btn">Clear Context</button>
            &emsp;
            <label for="themeSelect">Theme:&nbsp;</label>
            <select name="themes" id="themeSelect">
                <option class='themeOption' value="auto">Auto</option>
                <option class='themeOption' value="dark">Dark</option>
                <option class='themeOption' value="oled-dark">OLED Dark</option>
                <option class='themeOption' value="light">Light</option>
            </select>
        </div>
        <div id='response-p'>
            <p>&gt;</p>
        </div>
        <div class='input-console'>
            <select name="models" id="modelSelect" disabled>
                <option class='modelOption' value="">Fetching Models...</option>
            </select>
            <button id="listModelsRetryButton" class="btn" hidden>Retry</button>
            <input type="file" id="fileInput" hidden multiple>
            <label for="fileInput" id="fileInputLabel" hidden>Upload</label> 
            <input type="text" id="requestInput" name="Request" placeholder="Please select a model first" disabled>
            <input type="checkbox" id="thinkingCheckbox" class="tkcbRelated" name="Thinking" value="enableThinking" hidden>
            <label for="thinkingCheckbox" id="thinkingCheckboxLabel" class="tkcbRelated" hidden>Thinking</label>
            <button id="requestButton" class="btn" disabled>Generate Response</button>
        </div>
    </body>
</html>
